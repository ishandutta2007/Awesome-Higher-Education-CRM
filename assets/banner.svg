<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
      }
      @keyframes floatCard3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -80; }
      }
      @keyframes shimmer {
        0% { stop-color: #6366f1; }
        50% { stop-color: #a855f7; }
        100% { stop-color: #6366f1; }
      }
      .anim-glow {
        transform-origin: center;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .anim-float1 {
        animation: floatCard1 5s ease-in-out infinite;
      }
      .anim-float2 {
        animation: floatCard2 6s ease-in-out infinite;
      }
      .anim-float3 {
        animation: floatCard3 5.5s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dashMove 4s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Geometric Grid Accent (Subtle) -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="95" x2="1200" y2="95" />
    <line x1="0" y1="190" x2="1200" y2="190" />
    <line x1="0" y1="285" x2="1200" y2="285" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
  </g>

  <!-- Ambient Light Orbs (Background Glow) -->
  <circle cx="200" cy="80" r="140" fill="#4f46e5" opacity="0.25" filter="url(#glow)" class="anim-glow" />
  <circle cx="1020" cy="120" r="160" fill="#7c3aed" opacity="0.2" filter="url(#glow)" class="anim-glow" style="animation-delay: -3s;" />
  <circle cx="600" cy="340" r="180" fill="#06b6d4" opacity="0.15" filter="url(#glow)" class="anim-glow" style="animation-delay: -1.5s;" />

  <!-- Animated Data Flow Curves in Background Layer -->
  <path d="M 120 310 Q 350 240 600 290 T 1080 270" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.35" class="flow-line" />
  <path d="M 150 70 Q 450 140 750 90 T 1050 80" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.3" class="flow-line" style="animation-duration: 6s;" />

  <!-- Background Decorative Interactive Metric Cards (Positioned in lower sides, NEVER obstructing title) -->
  <!-- Left Lower Card: Lifecycle Tracking -->
  <g class="anim-float1" style="transform-origin: 160px 290px;">
    <rect x="60" y="260" width="220" height="70" rx="12" fill="url(#cardGrad1)" stroke="#4338ca" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="90" cy="295" r="16" fill="#4f46e5" opacity="0.8" />
    <text x="90" y="300" font-size="16" text-anchor="middle" fill="#fff">🎓</text>
    <text x="118" y="288" class="pill-text" fill="#cbd5e1">Admissions Funnel</text>
    <text x="118" y="312" class="pill-text" font-size="14" font-weight="700" fill="#38bdf8">99.8% Retention SLA</text>
  </g>

  <!-- Right Lower Card: AI Student Advising -->
  <g class="anim-float2" style="transform-origin: 1040px 290px;">
    <rect x="920" y="260" width="220" height="70" rx="12" fill="url(#cardGrad1)" stroke="#6d28d9" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="950" cy="295" r="16" fill="#7c3aed" opacity="0.8" />
    <text x="950" y="300" font-size="16" text-anchor="middle" fill="#fff">⚡</text>
    <text x="978" y="288" class="pill-text" fill="#cbd5e1">AI Copilot &amp; Advising</text>
    <text x="978" y="312" class="pill-text" font-size="14" font-weight="700" fill="#a78bfa">Smart Signal Outreach</text>
  </g>

  <!-- Small Top Right Floating Badge -->
  <g class="anim-float3" style="transform-origin: 1050px 50px;">
    <rect x="960" y="30" width="180" height="38" rx="19" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2" opacity="0.9" />
    <circle cx="982" cy="49" r="6" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="998" y="54" class="pill-text" fill="#38bdf8">FERPA &amp; Open SIS Ready</text>
  </g>

  <!-- Small Top Left Floating Badge -->
  <g class="anim-float2" style="transform-origin: 150px 50px;">
    <rect x="60" y="30" width="180" height="38" rx="19" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" opacity="0.9" />
    <text x="78" y="54" font-size="14">🏛️</text>
    <text x="100" y="54" class="pill-text" fill="#c084fc">Enterprise &amp; Open-Source</text>
  </g>

  <!-- FOREGROUND LAYER: Title, Subtitle, Badges Bar (100% Foreground, Z-Index Protected) -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Icon / Monogram -->
    <g transform="translate(0, -60)">
      <rect x="-30" y="-30" width="60" height="60" rx="16" fill="url(#primaryGlow)" filter="url(#glow)" opacity="0.9" />
      <text x="0" y="9" font-size="28" text-anchor="middle" fill="#ffffff">🏛️</text>
    </g>

    <!-- Main Title with Gradient Stroke Accent -->
    <text x="0" y="32" class="title-text">
      Awesome Higher Education CRM
    </text>

    <!-- Subtitle -->
    <text x="0" y="72" class="subtitle-text">
      The Curated Ecosystem for Admissions, Student Success, Advising &amp; Alumni Advancement
    </text>

    <!-- Pill Badges Row in Center Foreground -->
    <g transform="translate(0, 110)">
      <!-- Pill 1: Enterprise SaaS -->
      <g transform="translate(-230, 0)">
        <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
        <text x="0" y="5" class="pill-text" text-anchor="middle" fill="#93c5fd">☁️ Enterprise SaaS</text>
      </g>
      <!-- Pill 2: Open Source Core -->
      <g transform="translate(0, 0)">
        <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1" />
        <text x="0" y="5" class="pill-text" text-anchor="middle" fill="#6ee7b7">🔓 100% Open Source</text>
      </g>
      <!-- Pill 3: Full Lifecycle -->
      <g transform="translate(230, 0)">
        <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
        <text x="0" y="5" class="pill-text" text-anchor="middle" fill="#d8b4fe">🎯 Full Lifecycle</text>
      </g>
    </g>
  </g>
</svg>
